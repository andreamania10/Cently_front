<div class="d-flex justify-content-center align-items-center min-vh-100 bg-light px-3">
  <div class="card shadow-sm p-4" style="max-width: 380px; width: 100%;">
    <h3 class="mb-3 text-center">Crear compte</h3>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label class="form-label" for="name">Nom</label>
        <input id="name" type="text" class="form-control" formControlName="name" autocomplete="name"
          [class.is-invalid]="form.controls.name.touched && form.controls.name.invalid">
        <div class="invalid-feedback">El nom és obligatori.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">Correu electrònic</label>
        <input id="email" type="email" class="form-control" formControlName="email" autocomplete="email"
          [class.is-invalid]="form.controls.email.touched && form.controls.email.invalid">
        <div class="invalid-feedback">Introdueix un correu vàlid.</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Contrasenya</label>
        <input id="password" type="password" class="form-control" formControlName="password" autocomplete="new-password"
          [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid">
        <div class="invalid-feedback">Mínim 6 caràcters.</div>
      </div>

      <div class="alert alert-danger py-2" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn btn-warning w-100" [disabled]="loading">
        {{ loading ? 'Creant compte...' : 'Crear compte' }}
      </button>
    </form>

    <p class="text-center text-muted mt-3 mb-0">
      Ja tens compte? <a routerLink="/login">Inicia sessió</a>
    </p>
  </div>
</div>
