<app-navbar />

<div class="container pb-4" style="max-width: 700px;">
  <a routerLink="/historial/anys" class="btn btn-sm btn-outline-secondary mb-3">← Mira anys anteriors</a>

  <h3 class="mb-4">📊 Historial {{ year }}</h3>

  <p class="text-muted" *ngIf="loading">Carregant...</p>

  <p class="text-muted" *ngIf="!loading && months.length === 0">
    Encara no hi ha despeses registrades aquest any.
  </p>

  <div class="card shadow-sm p-3 mb-3" *ngFor="let month of months">
    <div class="d-flex justify-content-between align-items-baseline mb-2">
      <h5 class="mb-0">{{ monthLabel(month) }}</h5>
      <span class="text-muted small">Total: {{ totalForMonth(month) | number:'1.2-2' }} €</span>
    </div>
    <table class="table table-sm mb-0">
      <tbody>
        <tr *ngFor="let e of entriesForMonth(month)">
          <td>{{ e.category_name }}</td>
          <td class="text-end" [class.text-danger]="e.total_spent > e.limit_amount">
            {{ e.total_spent | number:'1.2-2' }} € / {{ e.limit_amount | number:'1.2-2' }} €
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
